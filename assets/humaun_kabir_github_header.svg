<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Humaun Kabir</title>
  <desc id="desc">Full-Stack Software Engineer working on web applications, SaaS platforms, and business systems.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1C"/>
      <stop offset="55%" stop-color="#111B38"/>
      <stop offset="100%" stop-color="#211442"/>
    </linearGradient>

    <linearGradient id="shape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity=".15"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#6366F1" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1020" cy="130" r="260" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g fill="none" stroke="#647DCC" stroke-opacity=".2">
    <path d="M700 0 L900 320 M800 0 L1000 320 M900 0 L1100 320 M1000 0 L1200 320"/>
    <path d="M700 80 H1200 M700 160 H1200 M700 240 H1200"/>
  </g>

  <!-- Geometric shapes -->
  <g fill="url(#shape)" opacity=".75">
    <path d="M950 -60 L1190 80 L1050 320 L810 180 Z"/>
    <path d="M1100 30 L1240 110 L1160 250 L1020 170 Z" opacity=".55"/>
    <path d="M850 190 L970 120 L1040 240 L920 310 Z" opacity=".45"/>
  </g>

  <!-- Geometric edge accents -->
  <g fill="none" stroke="#93C5FD" stroke-opacity=".5" stroke-width="1.2">
    <path d="M950 -60 L1190 80 L1050 320"/>
    <path d="M850 190 L970 120 L1040 240"/>
  </g>

  <!-- Small accents -->
  <g fill="#93C5FD" opacity=".65">
    <circle cx="900" cy="80" r="2"/>
    <circle cx="1080" cy="60" r="2"/>
    <circle cx="1120" cy="260" r="2"/>
    <circle cx="780" cy="230" r="2"/>
  </g>

  <!-- Typography -->
  <g font-family="Inter, Arial, sans-serif">
    <text x="85" y="125" fill="#FFFFFF" font-size="48" font-weight="700">
      Humaun Kabir
    </text>

    <rect x="87" y="148" width="48" height="3" rx="2" fill="#60A5FA"/>

    <text x="85" y="190" fill="#CBD5E1" font-size="19" font-weight="600" letter-spacing="1.2">
      FULL-STACK SOFTWARE ENGINEER
    </text>

    <text x="85" y="225" fill="#94A3B8" font-size="14">
      Web Applications · SaaS Platforms · Business Systems
    </text>
  </g>
</svg>
